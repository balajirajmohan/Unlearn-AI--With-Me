    focus: "Prompt design, structured outputs, and evaluation-driven iteration"
    planned_hours: 10
    resource: "Building Systems with the ChatGPT API"
    url: "https://www.deeplearning.ai/courses/chatgpt-building-system"
    deliverable: "Prompt suite with automated test cases"
  - week: 8
    phase: "AI application development"
    focus: "Function calling, tool schemas, validation, and error handling"
    planned_hours: 10
    resource: "AI Engineer Core Track"
    url: "https://www.udemy.com/course/llm-engineering-master-ai-and-large-language-models/"
    deliverable: "Tool-calling service with validated inputs"
  - week: 9
