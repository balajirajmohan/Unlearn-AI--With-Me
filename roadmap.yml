title: Full-stack AI engineering roadmap
description: The public teaching sequence for Unlearn AI — With Me.
privacy: Public educational source. Personal dates, hours, costs, and notes stay in the private workbook.
phases:
  - name: Foundations
    weeks: 1-4
    outcome: Explain AI systems, write typed Python, and call models directly.
  - name: AI application development
    weeks: 5-10
    outcome: Ship a tested, stateful AI service.
  - name: RAG engineering
    weeks: 11-16
    outcome: Build, evaluate, and secure a cited retrieval system.
  - name: Agents and LangGraph
    weeks: 17-22
    outcome: Build durable workflows with tools, approvals, and tests.
  - name: MCP
    weeks: 23-24
    outcome: Expose safe capabilities through authenticated MCP services.
  - name: Model development
    weeks: 25-28
    outcome: Train, adapt, evaluate, and release a small open model.
  - name: GPU and inference
    weeks: 29-34
    outcome: Profile workloads and serve models with measurable performance.
  - name: LLMOps and security
    weeks: 35-38
    outcome: Trace, evaluate, threat-model, and operate AI systems.
  - name: Cloud production
    weeks: 39-42
    outcome: Deploy managed-model and cloud-native workloads safely.
  - name: AI platform
    weeks: 43-44
    outcome: Build a serving platform with quotas, secrets, and GPU visibility.
  - name: Capstone
    weeks: 45-48
    outcome: Deliver a portfolio-ready Cloud Migration Copilot.
weeks:
  - week: 1
    phase: "Foundations"
    focus: "AI, ML, deep learning, GenAI, and LLM vocabulary"
    planned_hours: 8
    resource: "Generative AI for Everyone"
    url: "https://www.deeplearning.ai/courses/generative-ai-for-everyone/"
    deliverable: "Glossary, use-case map, and limits summary"
  - week: 2
    phase: "Foundations"
    focus: "Transformers, attention, embeddings, and tokenization"
    planned_hours: 9
    resource: "Karpathy and 3Blue1Brown"
    url: "https://www.youtube.com/watch?v=zjkBMFhNj_g"
    deliverable: "Explain the transformer and attention flow"
  - week: 3
    phase: "Foundations"
    focus: "Typed Python, environments, async, Git, and tests"
    planned_hours: 9
    resource: "Python and pytest documentation"
    url: "https://docs.pytest.org/en/stable/"
    deliverable: "Typed Python package with unit tests and CI"
  - week: 4
    phase: "Foundations"
    focus: "Model APIs, messages, sampling, structured output, and token cost"
    planned_hours: 9
    resource: "Generative AI with LLMs"
    url: "https://www.coursera.org/learn/generative-ai-with-llms"
    deliverable: "CLI model client with JSON output, latency, and cost"
  - week: 5
    phase: "AI application development"
    focus: "FastAPI, Pydantic, REST endpoints, and dependency injection"
    planned_hours: 10
    resource: "FastAPI tutorial"
    url: "https://fastapi.tiangolo.com/tutorial/first-steps/"
    deliverable: "Typed AI API with OpenAPI documentation"
  - week: 6
    phase: "AI application development"
    focus: "Async model clients, streaming, retries, timeouts, and rate limits"
    planned_hours: 10
    resource: "OpenAI Cookbook"
    url: "https://github.com/openai/openai-cookbook/tree/main/examples"
    deliverable: "Resilient streaming model client"
  - week: 7
