site_name: Unlearn AI — With Me
site_description: AI engineering explained through unlearning, building, breaking, and operating real systems.
site_url: https://balajirajmohan.github.io/Unlearn-AI--With-Me/
repo_name: balajirajmohan/Unlearn-AI--With-Me
repo_url: https://github.com/balajirajmohan/Unlearn-AI--With-Me
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Use light mode
  font:
    text: Inter
    code: IBM Plex Mono

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables

nav:
  - Home: index.md
  - Start here: start-here.md
  - Learning model: learning-model.md
  - Roadmap: roadmap.md
  - Lessons:
      - AI foundations:
          - Context windows: foundations/context-windows.md
      - Application development:
          - First LLM API lab: labs/first-llm-api.md
  - Resources: resources/curated-learning-path.md
  - Glossary: glossary.md

copyright: Built in public by Balaji Rajmohan
